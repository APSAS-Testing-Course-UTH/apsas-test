# SonarQube project metadata
sonar.projectKey=apsas-frontend
sonar.organization=apsas-test
sonar.sourceEncoding=UTF-8

# Analysis scope
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,**/__tests__/**,src/test/**
sonar.exclusions=src/api/**,src/routeTree.gen.ts,dist/**,coverage/**

# Coverage (Vitest)
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# TypeScript
sonar.typescript.tsconfigPaths=tsconfig.app.json
