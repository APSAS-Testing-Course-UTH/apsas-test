<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout}" lang="en">
<body>
<div th:fragment="content" th:remove="tag">
  <div class="max-w-2xl mx-auto">
    <div class="mb-6">
      <a th:href="@{/users}" class="text-blue-600 hover:underline">
        <i class="fas fa-arrow-left"></i>
        Back to Users
      </a>
    </div>

    <div class="card">
      <div class="card-header">
        <h2 class="text-2xl font-bold text-gray-800">
          <i class="fas fa-user-plus text-blue-600"></i>
          Create New User
        </h2>
      </div>
      <div class="card-body">
        <form th:action="@{/users}" method="post" th:object="${user}">
          <div class="form-group">
            <label for="email" class="form-label required">Email</label>
            <input type="email" id="email" name="email" th:field="*{email}" class="form-control"
                   required>
          </div>

          <div class="form-group">
            <label for="password" class="form-label required">Password</label>
            <input type="password" id="password" name="password" th:field="*{password}"
                   class="form-control" required minlength="8">
            <p class="text-sm text-gray-500 mt-1">Minimum 8 characters</p>
          </div>

          <div class="grid grid-cols-2 gap-4">
            <div class="form-group">
              <label for="firstName" class="form-label required">First Name</label>
              <input type="text" id="firstName" name="firstName" th:field="*{firstName}"
                     class="form-control" required>
            </div>

            <div class="form-group">
              <label for="lastName" class="form-label required">Last Name</label>
              <input type="text" id="lastName" name="lastName" th:field="*{lastName}"
                     class="form-control" required>
            </div>
          </div>

          <div class="form-group">
            <label for="role" class="form-label required">Role</label>
            <select id="role" name="role" th:field="*{role}" class="form-control" required>
              <option value="STUDENT">Student</option>
              <option value="INSTRUCTOR">Instructor</option>
              <option value="CONTENT_PROVIDER">Content Provider</option>
              <option value="ADMIN">Admin</option>
            </select>
          </div>

          <div class="form-group">
            <label class="inline-flex items-center">
              <input type="checkbox" name="isActive" th:field="*{isActive}" class="form-checkbox">
              <span class="ml-2">Active</span>
            </label>
          </div>

          <div class="form-group">
            <label class="inline-flex items-center">
              <input type="checkbox" name="isEmailVerified" th:field="*{isEmailVerified}"
                     class="form-checkbox">
              <span class="ml-2">Email Verified</span>
            </label>
          </div>

          <div class="flex gap-4 justify-end mt-6">
            <a th:href="@{/users}" class="btn btn-secondary">Cancel</a>
            <button type="submit" class="btn btn-primary">
              <i class="fas fa-save"></i>
              Create User
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
</body>
</html>
