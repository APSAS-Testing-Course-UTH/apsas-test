<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout}" lang="en">
<body>
<div th:fragment="content" th:remove="tag">
  <div class="flex justify-between items-center mb-6">
    <h1 class="text-3xl font-bold text-gray-800">
      <i class="fas fa-users text-blue-600"></i>
      User Management
    </h1>
    <a th:href="@{/users/new}" class="btn btn-primary">
      <i class="fas fa-plus"></i>
      Create User
    </a>
  </div>

  <!-- Filters -->
  <div class="card mb-6">
    <div class="card-body">
      <form th:action="@{/users}" method="get" class="flex items-end gap-4">
        <div class="form-group flex-1">
          <label for="role" class="form-label">Filter by Role</label>
          <select id="role" name="role" class="form-control">
            <option value="">All Roles</option>
            <option value="STUDENT" th:selected="${selectedRole == 'STUDENT'}">Student</option>
            <option value="INSTRUCTOR" th:selected="${selectedRole == 'INSTRUCTOR'}">Instructor
            </option>
            <option value="CONTENT_PROVIDER" th:selected="${selectedRole == 'CONTENT_PROVIDER'}">
              Content Provider
            </option>
            <option value="ADMIN" th:selected="${selectedRole == 'ADMIN'}">Admin</option>
          </select>
        </div>
        <div class="form-group">
          <button type="submit" class="btn btn-secondary">
            <i class="fas fa-filter"></i>
            Apply Filter
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Users Table -->
  <div class="card">
    <div class="card-body">
      <div class="overflow-x-auto">
        <table class="table table-full table-striped">
          <thead>
          <tr>
            <th>Email</th>
            <th>Name</th>
            <th>Role</th>
            <th>Status</th>
            <th>Email Verified</th>
            <th>Created At</th>
            <th class="text-right">Actions</th>
          </tr>
          </thead>
          <tbody>
          <tr th:if="${users == null || users.content.isEmpty()}">
            <td colspan="7" class="text-center text-gray-500 py-8">
              <i class="fas fa-inbox text-4xl mb-2"></i>
              <p>No users found</p>
            </td>
          </tr>
          <tr th:each="user : ${users.content}">
            <td>
              <a th:href="@{/users/{id}(id=${user.id})}" class="text-blue-600 hover:underline"
                 th:text="${user.email}"></a>
            </td>
            <td th:text="${user.firstName + ' ' + user.lastName}"></td>
            <td>
              <span class="badge"
                    th:classappend="${user.role == 'ADMIN'} ? 'badge-danger' : (${user.role == 'INSTRUCTOR'} ? 'badge-warning' : 'badge-info')"
                    th:text="${user.role}"></span>
            </td>
            <td>
              <span class="badge"
                    th:classappend="${user.isActive} ? 'badge-success' : 'badge-secondary'"
                    th:text="${user.isActive ? 'Active' : 'Inactive'}"></span>
            </td>
            <td>
              <i th:if="${user.isEmailVerified}" class="fas fa-check-circle text-green-600"></i>
              <i th:unless="${user.isEmailVerified}" class="fas fa-times-circle text-red-600"></i>
            </td>
            <td th:text="${#temporals.format(user.createdAt, 'MMM dd, yyyy HH:mm')}"></td>
            <td class="text-right">
              <div class="inline-flex gap-2">
                <a th:href="@{/users/{id}(id=${user.id})}" class="btn btn-sm btn-secondary"
                   title="View Details">
                  <i class="fas fa-eye"></i>
                </a>
                <form th:if="${!user.isActive}" th:action="@{/users/{id}/activate(id=${user.id})}"
                      method="post" class="inline">
                  <button type="submit" class="btn btn-sm btn-success" title="Activate">
                    <i class="fas fa-check"></i>
                  </button>
                </form>
                <form th:if="${user.isActive}" th:action="@{/users/{id}/deactivate(id=${user.id})}"
                      method="post" class="inline">
                  <button type="submit" class="btn btn-sm btn-warning" title="Deactivate">
                    <i class="fas fa-ban"></i>
                  </button>
                </form>
                <form th:action="@{/users/{id}/delete(id=${user.id})}" method="post" class="inline"
                      onsubmit="return confirm('Are you sure you want to delete this user?');">
                  <button type="submit" class="btn btn-sm btn-danger" title="Delete">
                    <i class="fas fa-trash"></i>
                  </button>
                </form>
              </div>
            </td>
          </tr>
          </tbody>
        </table>
      </div>

      <!-- Pagination -->
      <div th:if="${users != null && users.totalPages > 1}"
           class="flex justify-between items-center mt-4 pt-4 border-t">
        <div class="text-sm text-gray-600">
          Showing <span th:text="${users.pageSize * users.pageNumber + 1}"></span> to
          <span
              th:text="${users.pageSize * (users.pageNumber + 1) > users.totalElements ? users.totalElements : users.pageSize * (users.pageNumber + 1)}"></span>
          of <span th:text="${users.totalElements}"></span> users
        </div>
        <div class="flex gap-2">
          <a th:if="${!users.first}"
             th:href="@{/users(page=${currentPage - 1}, size=${pageSize}, role=${selectedRole})}"
             class="btn btn-sm btn-secondary">
            <i class="fas fa-chevron-left"></i>
            Previous
          </a>
          <span class="px-4 py-2 text-sm text-gray-700">
            Page <span th:text="${currentPage + 1}"></span> of <span
              th:text="${users.totalPages}"></span>
          </span>
          <a th:if="${!users.last}"
             th:href="@{/users(page=${currentPage + 1}, size=${pageSize}, role=${selectedRole})}"
             class="btn btn-sm btn-secondary">
            Next
            <i class="fas fa-chevron-right"></i>
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
