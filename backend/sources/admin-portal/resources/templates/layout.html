<!DOCTYPE html>
<html xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>APSAS Admin Portal</title>
  <link rel="shortcut icon" th:href="@{/assets/img/favicon.png}" type="image/png">
  <link rel="stylesheet" th:href="@{/static/css/admin-portal.css}">
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
  >
</head>
<body class="bg-gray-50">
<div class="min-h-screen flex flex-col">
  <!-- Header -->
  <header class="bg-white shadow-sm border-b">
    <div class="container mx-auto px-4 py-4">
      <div class="flex items-center justify-between">
        <div class="flex items-center space-x-6">
          <a th:href="@{/}" class="flex text-2xl font-bold text-gray-800 items-center">
            <img
                th:src="@{/assets/img/icon-spring-boot-admin.svg}"
                alt="APSAS Logo"
                class="inline"
                style="height: 32px; width: 32px; margin-right: 8px;"
            >
            APSAS Admin
          </a>
          <nav class="hidden md:flex space-x-4">
            <a th:href="@{/}" class="nav-link">
              <i class="fas fa-tachometer-alt"></i>
              Dashboard
            </a>
            <a th:href="@{/users}" class="nav-link" th:classappend="${true} ? 'active' : ''">
              <i class="fas fa-users"></i>
              Users
            </a>
          </nav>
        </div>
        <div class="flex items-center space-x-4">
          <span class="text-sm text-gray-600"
                sec:authentication="principal.username">User</span>
          <form th:action="@{/logout}" method="post" class="inline">
            <button type="submit" class="btn btn-secondary btn-sm">
              <i class="fas fa-sign-out-alt"></i>
              Logout
            </button>
          </form>
        </div>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="flex-grow container mx-auto px-4 py-6">
    <!-- Flash Messages -->
    <!--/*@thymesVar id="success" type="java.lang.String"*/-->
    <div th:if="${success}" class="alert alert-success mb-4">
      <i class="fas fa-check-circle"></i>
      <span th:text="${success}"></span>
    </div>
    <!--/*@thymesVar id="error" type="java.lang.String"*/-->
    <div th:if="${error}" class="alert alert-error mb-4">
      <i class="fas fa-exclamation-circle"></i>
      <span th:text="${error}"></span>
    </div>

    <!-- Page Content -->
    <div th:replace="~{this :: content}">
      Content goes here
    </div>
  </main>

  <!-- Footer -->
  <footer class="bg-white border-t py-4 mt-auto">
    <div class="container mx-auto px-4 text-center text-sm text-gray-600">
      <p>&copy; 2025 APSAS - Automated Programming Skills Assessment System</p>
    </div>
  </footer>
</div>
</body>
</html>
