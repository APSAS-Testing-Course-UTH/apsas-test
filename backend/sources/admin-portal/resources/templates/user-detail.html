<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout}" lang="en">
<body>
<div th:fragment="content" th:remove="tag">
  <div class="max-w-4xl mx-auto">
    <div class="mb-6">
      <a th:href="@{/users}" class="text-blue-600 hover:underline">
        <i class="fas fa-arrow-left"></i>
        Back to Users
      </a>
    </div>

    <div class="card">
      <div class="card-header">
        <h2 class="text-2xl font-bold text-gray-800">
          <i class="fas fa-user text-blue-600"></i>
          User Details
        </h2>
      </div>
      <div class="card-body">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div class="detail-item">
            <span class="label">User ID</span>
            <span class="text-gray-800 font-mono text-sm" th:text="${user.id}"></span>
          </div>

          <div class="detail-item">
            <span class="label">Email</span>
            <span class="text-gray-800" th:text="${user.email}"></span>
          </div>

          <div class="detail-item">
            <span class="label">First Name</span>
            <span class="text-gray-800" th:text="${user.firstName}"></span>
          </div>

          <div class="detail-item">
            <span class="label">Last Name</span>
            <span class="text-gray-800" th:text="${user.lastName}"></span>
          </div>

          <div class="detail-item">
            <span class="label">Role</span>
            <span class="badge"
                  th:classappend="${user.role == 'ADMIN'} ? 'badge-danger' : (${user.role == 'INSTRUCTOR'} ? 'badge-warning' : 'badge-info')"
                  th:text="${user.role}"></span>
          </div>

          <div class="detail-item">
            <span class="label">Status</span>
            <span class="badge"
                  th:classappend="${user.isActive} ? 'badge-success' : 'badge-secondary'"
                  th:text="${user.isActive ? 'Active' : 'Inactive'}"></span>
          </div>

          <div class="detail-item">
            <span class="label">Email Verified</span>
            <span>
              <i th:if="${user.isEmailVerified}" class="fas fa-check-circle text-green-600"></i>
              <i th:unless="${user.isEmailVerified}" class="fas fa-times-circle text-red-600"></i>
              <span th:text="${user.isEmailVerified ? 'Yes' : 'No'}"></span>
            </span>
          </div>

          <div class="detail-item">
            <span class="label">Created At</span>
            <span class="text-gray-800"
                  th:text="${#temporals.format(user.createdAt, 'MMM dd, yyyy HH:mm:ss')}"></span>
          </div>

          <div class="detail-item">
            <span class="label">Updated At</span>
            <span class="text-gray-800"
                  th:text="${#temporals.format(user.updatedAt, 'MMM dd, yyyy HH:mm:ss')}"></span>
          </div>
        </div>

        <div class="flex gap-4 justify-end mt-8 pt-6 border-t">
          <form th:if="${!user.isActive}" th:action="@{/users/{id}/activate(id=${user.id})}"
                method="post" class="inline">
            <button type="submit" class="btn btn-success">
              <i class="fas fa-check"></i>
              Activate User
            </button>
          </form>
          <form th:if="${user.isActive}" th:action="@{/users/{id}/deactivate(id=${user.id})}"
                method="post" class="inline">
            <button type="submit" class="btn btn-warning">
              <i class="fas fa-ban"></i>
              Deactivate User
            </button>
          </form>
          <form th:action="@{/users/{id}/delete(id=${user.id})}" method="post" class="inline"
                onsubmit="return confirm('Are you sure you want to delete this user? This action cannot be undone.');">
            <button type="submit" class="btn btn-danger">
              <i class="fas fa-trash"></i>
              Delete User
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
