server:
  port: 8888

spring:
  application:
    name: configserver

  profiles:
    include: native

  cloud:
    config:
      server:
        native:
          fail-on-error: true

eureka:
  instance:
    hostname: ${HOSTNAME:localhost}
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
