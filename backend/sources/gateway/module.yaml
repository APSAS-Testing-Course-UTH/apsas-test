product: jvm/app
apply:
  - ../spring-cloud.module-template.yaml

settings:
  jvm:
    mainClass: apsas.gateway.ApiGatewayApplication

dependencies:
  - $spring.boot.starter
  - $spring.boot.starter.webflux
  - $spring.boot.starter.oauth2.resource.server
  - $libs.spring.cloud.starter.gateway.server.webflux
  - $libs.spring.cloud.starter.netflix.eureka.client
  - $libs.spring.cloud.starter.config
  - $libs.spring.cloud.starter.loadbalancer
  - $libs.springdoc.openapi.starter.webflux.ui
