product: jvm/lib
apply:
  - ../../jvm.module-template.yaml
  - ../spring-lib.module-template.yaml

settings:
  kotlin:
    freeCompilerArgs:
      - -Xjsr305=strict
      - -Xannotation-default-target=param-property

    allOpen:
      presets:
        - spring

dependencies:
  - ../security
  - $kotlin.reflect: exported
  - $kotlin.test.junit5: exported
  - $spring.boot.starter.test: exported
  - $spring.boot.starter.webflux: exported
  - $libs.spring.security.test: exported
  - $libs.jackson.module.kotlin
  - $spring.boot.testcontainers: exported
  - $libs.testcontainers.junit.jupiter: exported
  - $libs.testcontainers.postgresql: exported
  - $libs.testcontainers.rabbitmq: exported
