eureka:
  client:
    enabled: false

spring:
  cloud:
    config:
      enabled: false
  application:
    name: evaluation-service
  threads:
    virtual:
      enabled: true

# Piston API configuration for tests
piston:
  api:
    url: http://localhost:2000

# Async configuration for tests
spring.task.execution:
  pool:
    core-size: 5
    max-size: 10
    queue-capacity: 100

# Logging configuration for tests
logging:
  level:
    apsas.evaluation: DEBUG
    org.springframework.amqp: WARN
