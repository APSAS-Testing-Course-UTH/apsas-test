product: jvm/app

apply:
  - ../../jvm.module-template.yaml
  - ../service.module-template.yaml

settings:
  jvm:
    mainClass: apsas.evaluation.EvaluationServiceApplication
  java:
    annotationProcessing:
      processors:
        - $libs.mapstruct.processor

dependencies:
  - ../../shared/messaging
  - ../../shared/models
  - ../../shared/feign-clients
  - $spring.boot.starter.web
  - $spring.boot.starter.validation
  - $libs.springdoc.openapi.starter.webmvc.api
  - $libs.spring.retry
  - $spring.boot.starter.aop
  - $libs.mapstruct

test-settings:
  jvm:
    test:
      freeJvmArgs:
        - -XX:+EnableDynamicAgentLoading

  kotlin:
    freeCompilerArgs:
      - -Xjsr305=strict
      - -Xannotation-default-target=param-property

    allOpen:
      presets: [ spring ]

test-dependencies:
  - $kotlin.reflect
  - $kotlin.test.junit5
  - $spring.boot.starter.test
  - $spring.boot.starter.webflux
  - $libs.jackson.module.kotlin
  - $spring.boot.testcontainers
  - $libs.testcontainers.junit.jupiter
  - $libs.testcontainers.rabbitmq
  - $libs.mockito.kotlin
