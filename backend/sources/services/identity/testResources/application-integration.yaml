spring:
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_schema: identity

  sql:
    init:
      mode: always

jwt:
  secret: test-secret-key-for-integration-tests-must-be-at-least-256-bits-long
  expiration: 3600000
  issuer: apsas-test

verification:
  email-token-expiration: 86400
  password-reset-token-expiration: 3600
