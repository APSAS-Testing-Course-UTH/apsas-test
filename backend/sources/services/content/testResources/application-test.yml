spring:
  config:
    import: "optional:file:./"

  cloud:
    config:
      enabled: false
      import-check:
        enabled: false
    discovery:
      enabled: false

  application:
    name: content-service-test

  datasource:
    url: jdbc:h2:mem:contentdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
        default_schema: content

  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

  data:
    redis:
      repositories:
        enabled: false

  cache:
    type: simple

  main:
    allow-bean-definition-overriding: true

  rabbitmq:
    listener:
      simple:
        auto-startup: false

eureka:
  client:
    enabled: false

logging:
  level:
    org.springframework.jdbc.datasource.init: DEBUG
