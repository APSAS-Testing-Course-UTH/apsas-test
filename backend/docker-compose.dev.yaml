name: apasas-backend-dev
services:
  # Infrastructure Services
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: apsas
      POSTGRES_PASSWORD: apsas
      POSTGRES_DB: apsas
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - apsas-backend

  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: apsas
      RABBITMQ_DEFAULT_PASS: apsas
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - apsas-backend

  mailpit:
    image: axllent/mailpit:latest
    volumes:
      - mailpit_data:/data
    networks:
      - apsas-backend
    ports:
      - "8025:8025"
      - "1025:1025"

  redis:
    image: redis:8.2-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - apsas-backend

networks:
  apsas-backend:
    driver: bridge

volumes:
  postgres_data:
  rabbitmq_data:
  mailpit_data:
  redis_data:
