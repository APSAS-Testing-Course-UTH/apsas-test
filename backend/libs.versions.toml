[versions]
spring-cloud = "2025.0.0"
springdoc = "2.8.13"
hypersistence-utils-hibernate = "3.11.0"
mapstruct = "1.6.3"
firebase-admin = "9.4.2"
protobuf = "4.32.1"

[libraries]
spring-cloud-dependencies = { module = "org.springframework.cloud:spring-cloud-dependencies", version.ref = "spring-cloud" }
spring-cloud-starter-gateway-server-webflux = "org.springframework.cloud:spring-cloud-starter-gateway-server-webflux"
spring-cloud-starter-netflix-eureka-server = "org.springframework.cloud:spring-cloud-starter-netflix-eureka-server"
spring-cloud-starter-netflix-eureka-client = "org.springframework.cloud:spring-cloud-starter-netflix-eureka-client"
spring-cloud-starter-config = "org.springframework.cloud:spring-cloud-starter-config"
spring-cloud-config-server = "org.springframework.cloud:spring-cloud-config-server"
spring-cloud-starter-loadbalancer = "org.springframework.cloud:spring-cloud-starter-loadbalancer"
spring-cloud-starter-openfeign = "org.springframework.cloud:spring-cloud-starter-openfeign"

springdoc-openapi-starter-webflux-ui = { module = "org.springdoc:springdoc-openapi-starter-webflux-ui", version.ref = "springdoc" }
springdoc-openapi-starter-webmvc-api = { module = "org.springdoc:springdoc-openapi-starter-webmvc-api", version.ref = "springdoc" }

hypersistence-utils-hibernate63 = { module = "io.hypersistence:hypersistence-utils-hibernate-63", version.ref = "hypersistence-utils-hibernate" }

mapstruct-processor = { module = "org.mapstruct:mapstruct-processor", version.ref = "mapstruct" }
mapstruct = { module = "org.mapstruct:mapstruct", version.ref = "mapstruct" }

firebase-admin = { module = "com.google.firebase:firebase-admin", version.ref = "firebase-admin" }
protobuf-java-util = { module = "com.google.protobuf:protobuf-java-util", version.ref = "protobuf" }

# Version is managed by Spring Boot
spring-security-oauth2-jose = "org.springframework.security:spring-security-oauth2-jose"
postgresql = "org.postgresql:postgresql"
spring-retry = "org.springframework.retry:spring-retry:2.0.12"
testcontainers-junit-jupiter = "org.testcontainers:junit-jupiter"
testcontainers-postgresql = "org.testcontainers:postgresql"
testcontainers-rabbitmq = "org.testcontainers:rabbitmq"
jackson-module-kotlin = "com.fasterxml.jackson.module:jackson-module-kotlin"
spring-security-test = "org.springframework.security:spring-security-test"
