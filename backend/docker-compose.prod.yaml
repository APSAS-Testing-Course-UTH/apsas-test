name: apsas-backend
services:
  # ============================================================================
  # INFRASTRUCTURE SERVICES
  # ============================================================================

  postgres:
    image: postgres:17-alpine
    container_name: apsas-db
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - apsas-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USERNAME}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 512mb

  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    container_name: apsas-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - apsas-network
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 512mb

  redis:
    image: redis:8.2-alpine
    container_name: apsas-redis
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --appendfsync everysec
      --maxmemory ${REDIS_MAXMEMORY:-128mb}
      --maxmemory-policy ${REDIS_MAXMEMORY_POLICY:-allkeys-lru}
    volumes:
      - redis_data:/data
    networks:
      - apsas-network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 128mb

  # ============================================================================
  # SERVICE REGISTRY (Netflix Eureka)
  # ============================================================================

  service-registry:
    image: tozydev/apsas-service-registry:${REGISTRY_VERSION:-latest}
    container_name: apsas-service-registry
    environment:
      SPRING_PROFILES_ACTIVE: prod
      EUREKA_INSTANCE_HOSTNAME: service-registry
      THC_PATH: /actuator/health
      THC_PORT: 8761
    networks:
      - apsas-network
    healthcheck:
      test: [ "CMD", "/workspace/health-check" ]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 1024mb

  # ============================================================================
  # CONFIG SERVER
  # ============================================================================

  config-server:
    image: tozydev/apsas-config-server:${CONFIG_VERSION:-latest}
    container_name: apsas-config-server
    environment:
      SPRING_PROFILES_ACTIVE: prod
      EUREKA_URL: http://service-registry:8761/eureka/
      EUREKA_INSTANCE_HOSTNAME: config-server
      THC_PATH: /actuator/health
      THC_PORT: 8888
      MANAGEMENT_ENDPOINT_ENV_SHOW_VALUES: always
    env_file:
      - .env
    volumes:
      - ./config:/config
    networks:
      - apsas-network
    depends_on:
      service-registry:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "/workspace/health-check" ]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 1024mb

  # ============================================================================
  # API GATEWAY (Only externally exposed service)
  # ============================================================================

  api-gateway:
    image: tozydev/apsas-gateway:${GATEWAY_VERSION:-latest}
    container_name: apsas-gateway
    environment:
      # JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--Xmx512m -Xms256m}
      SPRING_PROFILES_ACTIVE: prod
      EUREKA_URL: http://service-registry:8761/eureka/
      EUREKA_INSTANCE_HOSTNAME: api-gateway
      SPRING_CLOUD_CONFIG_DISOVERY_SERVICE_ID: config-server
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888
      THC_PATH: /actuator/health
      THC_PORT: 8080
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    networks:
      - apsas-network
    depends_on:
      service-registry:
        condition: service_healthy
      config-server:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "/workspace/health-check" ]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 1024mb

  # ============================================================================
  # MICROSERVICES
  # ============================================================================

  identity-service:
    image: tozydev/apsas-identity:${IDENTITY_VERSION:-latest}
    container_name: apsas-identity
    environment:
      SPRING_PROFILES_ACTIVE: prod
      EUREKA_URL: http://service-registry:8761/eureka/
      EUREKA_INSTANCE_HOSTNAME: identity-service
      SPRING_CLOUD_CONFIG_DISOVERY_SERVICE_ID: config-server
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888
    networks:
      - apsas-network
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      service-registry:
        condition: service_healthy
      config-server:
        condition: service_healthy
    mem_limit: 1024mb

  content-service:
    image: tozydev/apsas-content:${CONTENT_VERSION:-latest}
    container_name: apsas-content
    environment:
      SPRING_PROFILES_ACTIVE: prod
      EUREKA_URL: http://service-registry:8761/eureka/
      EUREKA_INSTANCE_HOSTNAME: content-service
      SPRING_CLOUD_CONFIG_DISOVERY_SERVICE_ID: config-server
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888
    networks:
      - apsas-network
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      service-registry:
        condition: service_healthy
      config-server:
        condition: service_healthy
    mem_limit: 1024mb

  submission-service:
    image: tozydev/apsas-submission:${SUBMISSION_VERSION:-latest}
    container_name: apsas-submission
    environment:
      SPRING_PROFILES_ACTIVE: prod
      EUREKA_URL: http://service-registry:8761/eureka
      EUREKA_INSTANCE_HOSTNAME: submission-service
      SPRING_CLOUD_CONFIG_DISOVERY_SERVICE_ID: config-server
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888
    networks:
      - apsas-network
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      service-registry:
        condition: service_healthy
      config-server:
        condition: service_healthy
    mem_limit: 1024mb

  evaluation-service:
    image: tozydev/apsas-evaluation:${EVALUATION_VERSION:-latest}
    container_name: apsas-evaluation
    environment:
      SPRING_PROFILES_ACTIVE: prod
      EUREKA_URL: http://service-registry:8761/eureka
      EUREKA_INSTANCE_HOSTNAME: evaluation-service
      SPRING_CLOUD_CONFIG_DISOVERY_SERVICE_ID: config-server
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888
    networks:
      - apsas-network
    depends_on:
      rabbitmq:
        condition: service_healthy
      service-registry:
        condition: service_healthy
      config-server:
        condition: service_healthy
    mem_limit: 1024mb

  support-service:
    image: tozydev/apsas-support:${SUPPORT_VERSION:-latest}
    container_name: apsas-support
    environment:
      SPRING_PROFILES_ACTIVE: prod
      EUREKA_URL: http://service-registry:8761/eureka
      EUREKA_INSTANCE_HOSTNAME: support-service
      SPRING_CLOUD_CONFIG_DISOVERY_SERVICE_ID: config-server
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888
    networks:
      - apsas-network
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      service-registry:
        condition: service_healthy
      config-server:
        condition: service_healthy
    mem_limit: 1024mb

  notification-service:
    image: tozydev/apsas-notification:${NOTIFICATION_VERSION:-latest}
    container_name: apsas-notification
    environment:
      SPRING_PROFILES_ACTIVE: prod
      EUREKA_URL: http://service-registry:8761/eureka
      EUREKA_INSTANCE_HOSTNAME: notification-service
      SPRING_CLOUD_CONFIG_DISOVERY_SERVICE_ID: config-server
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888
    networks:
      - apsas-network
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      service-registry:
        condition: service_healthy
      config-server:
        condition: service_healthy
    mem_limit: 1024mb

# ============================================================================
# NETWORKS
# ============================================================================
networks:
  apsas-network:
    driver: bridge

# ============================================================================
# VOLUMES
# ============================================================================
volumes:
  postgres_data:
    driver: local
  rabbitmq_data:
    driver: local
  redis_data:
    driver: local
