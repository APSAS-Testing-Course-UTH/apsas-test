spring:
  config:
    import:
      - file:./config/fragments/jwt.yaml
      - file:./config/fragments/springdoc.yaml
      - file:./config/fragments/eureka-client.yaml

  security:
    user:
      name: ${ADMIN_USERNAME}
      password: ${ADMIN_PASSWORD}

  cloud:
    loadbalancer:
      cache:
        ttl: 15s

    gateway:


      server:
        webflux:
          discovery:
            locator:
              enabled: true

          httpclient:
            connect-timeout: 10000
            response-timeout: 30s

          default-filters:
            - name: RequestSize
              args:
                maxSize: 10MB

          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins: "*"
                allowedMethods: "*"
                allowedHeaders: "*"

          routes:
            - id: identity-service
              uri: lb://identity-service
              predicates:
                - Path=/api/auth/**, /api/v1/users/**, /api-docs/identity-service
              filters:
                - RewritePath=/api-docs/(?<segment>.*), /api-docs

            - id: content-service
              uri: lb://content-service
              predicates:
                - Path=/api/v1/assignments/**, /api/v1/tutorials/**, /api/v1/skills/**, /api-docs/content-service
              filters:
                - RewritePath=/api-docs/(?<segment>.*), /api-docs

            - id: submission-service
              uri: lb://submission-service
              predicates:
                - Path=/api/v1/submissions/**, /api-docs/submission-service
              filters:
                - RewritePath=/api-docs/(?<segment>.*), /api-docs

            - id: evaluation-service
              uri: lb://evaluation-service
              predicates:
                - Path=/api/v1/runtimes/**, /api-docs/evaluation-service
              filters:
                - RewritePath=/api-docs/(?<segment>.*), /api-docs

            - id: support-service
              uri: lb://support-service
              predicates:
                - Path=/api/v1/support/**, /api-docs/support-service
              filters:
                - RewritePath=/api-docs/(?<segment>.*), /api-docs

            - id: support-service-websocket
              uri: lb:ws://support-service
              predicates:
                - Path=/ws/support/**

            - id: notification-service
              uri: lb://notification-service
              predicates:
                - Path=/api/v1/preferences/**, /api/v1/devices/**, /api-docs/notification-service
              filters:
                - RewritePath=/api-docs/(?<segment>.*), /api-docs

server:
  port: 8080
  max-http-request-header-size: 8KB

apsas:
  gateway:
    rate-limit:
      max-requests: 20
      window-seconds: 1
      path-prefix: /api/
    header-limit:
      max-size-bytes: 8192
      path-prefix: /api/

springdoc:
  swagger-ui:
    urls:
      - name: Identity Service
        url: /api-docs/identity-service

      - name: Content Service
        url: /api-docs/content-service

      - name: Submission Service
        url: /api-docs/submission-service

      - name: Evaluation Service
        url: /api-docs/evaluation-service

      - name: Support Service
        url: /api-docs/support-service

      - name: Notification Service
        url: /api-docs/notification-service

eureka:
  instance:
    metadata-map:
      user.name: ${spring.security.user.name}
      user.password: ${spring.security.user.password}
