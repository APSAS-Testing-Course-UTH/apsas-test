spring:
  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME}
    password: ${SMTP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:true}
          starttls:
            enable: ${SMTP_TLS_ENABLED:true}
            required: ${SMTP_TSL_REQUIRED:true}
        transport:
          protocol: smtp
    default-encoding: UTF-8
