[versions]
spring-boot = "3.5.11"
spring-dependency-management = "1.1.7"
#noinspection UnusedVersionCatalogEntry
spring-cloud = "2025.0.1"
spring-boot-admin = "3.5.8"

springdoc = "2.8.16"
hypersistence-utils-hibernate = "3.15.2"
mapstruct = "1.6.3"
firebase-admin = "9.8.0"
sonarqube = "7.2.3.7755"
allure = "2.33.0"
aspectj = "1.9.25.1"
instancio = "6.0.0-RC2"

[libraries]
springdoc-openapi-starter-webflux-ui = { module = "org.springdoc:springdoc-openapi-starter-webflux-ui", version.ref = "springdoc" }
springdoc-openapi-starter-webmvc-api = { module = "org.springdoc:springdoc-openapi-starter-webmvc-api", version.ref = "springdoc" }

hypersistence-utils-hibernate63 = { module = "io.hypersistence:hypersistence-utils-hibernate-63", version.ref = "hypersistence-utils-hibernate" }

#noinspection UnusedVersionCatalogEntry
mapstruct-processor = { module = "org.mapstruct:mapstruct-processor", version.ref = "mapstruct" }
#noinspection UnusedVersionCatalogEntry
mapstruct = { module = "org.mapstruct:mapstruct", version.ref = "mapstruct" }

firebase-admin = { module = "com.google.firebase:firebase-admin", version.ref = "firebase-admin" }

instancio-bom = { module = "org.instancio:instancio-bom", version.ref = "instancio" }
instancio-core = { module = "org.instancio:instancio-core" }
instancio-junit = { module = "org.instancio:instancio-junit" }

allure-bom = { module = "io.qameta.allure:allure-bom", version.ref = "allure" }
allure-junit5 = { module = "io.qameta.allure:allure-junit5" }

aspectj-weaver = { module = "org.aspectj:aspectjweaver", version.ref = "aspectj" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "spring-dependency-management" }
sonarqube = { id = "org.sonarqube", version.ref = "sonarqube" }
