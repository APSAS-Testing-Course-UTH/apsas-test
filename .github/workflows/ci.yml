name: CI
on:
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "**.md"
      - ".allure/history.jsonl"
  pull_request:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "**.md"
      - ".allure/history.jsonl"

permissions:
  pull-requests: write
  checks: write
  contents: write
  id-token: write
  pages: write

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: jetbrains
          java-version: "21"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          add-job-summary-as-pr-comment: always

      - name: Test and dump results
        run: gradle test
        working-directory: backend/

      - name: Collect backend Allure results
        if: always()
        run: |
          rm -rf ./allure-results-backend
          mkdir -p ./allure-results-backend
          while IFS= read -r -d '' dir; do
            cp -R "${dir}/." ./allure-results-backend/
          done < <(find ./backend -type d -path "*/build/allure-results" -print0)

      - name: Zip test results
        if: always()
        run: |
          if [ -d "./allure-results-backend" ]; then
            npx allure results pack "./allure-results-backend" --name allure-results-backend.zip
          else
            echo "No backend allure results directory found, skipping pack step."
          fi

      - name: Upload test results
        if: always() && hashFiles('allure-results-backend.zip') != ''
        uses: actions/upload-artifact@v7
        with:
          name: allure-results-backend
          path: allure-results-backend.zip
          compression-level: 0
          retention-days: 1

  test-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install E2E dependencies
        run: bun install --frozen-lockfile
        working-directory: e2e/

      - name: Run E2E tests
        run: bun run test:ci
        working-directory: e2e/

      - name: Zip E2E test results
        if: always()
        run: |
          if [ -d "./e2e/allure-results" ]; then
            npx allure results pack "./e2e/allure-results" --name allure-results-e2e.zip
          else
            echo "No e2e allure results directory found, skipping pack step."
          fi

      - name: Upload E2E test results
        if: always() && hashFiles('allure-results-e2e.zip') != ''
        uses: actions/upload-artifact@v7
        with:
          name: allure-results-e2e
          path: allure-results-e2e.zip
          compression-level: 0
          retention-days: 1

  report:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: [ test-backend, test-e2e ]
    steps:
      - uses: actions/checkout@v6

      - name: Download backend test results
        uses: actions/download-artifact@v7
        with:
          name: allure-results-backend
          path: ./

      - name: Download E2E test results
        uses: actions/download-artifact@v7
        with:
          name: allure-results-e2e
          path: ./

      - name: Unpack backend and E2E test results
        run: |
          rm -rf ./allure-results
          npx allure results unpack --output ./allure-results/backend allure-results-backend.zip
          npx allure results unpack --output ./allure-results/e2e allure-results-e2e.zip

      - name: Build report
        run: npx allure generate "./allure-results/**" --config ./allurerc.mjs

      - name: Allure Report Official
        uses: allure-framework/allure-action@v0
        with:
          report-directory: "./allure-report"
          github-token: ${{ secrets.GITHUB_TOKEN }}

  deploy-report:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: test-report
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [ test-backend, test-e2e ]
    steps:
      - uses: actions/checkout@v6

      - name: Download backend test results
        uses: actions/download-artifact@v7
        with:
          name: allure-results-backend
          path: ./

      - name: Download E2E test results
        uses: actions/download-artifact@v7
        with:
          name: allure-results-e2e
          path: ./

      - name: Unpack backend and E2E test results
        run: |
          rm -rf ./allure-results
          npx allure results unpack --output ./allure-results/backend allure-results-backend.zip
          npx allure results unpack --output ./allure-results/e2e allure-results-e2e.zip

      - name: Build report
        run: npx allure generate "./allure-results/**" --config ./allurerc.mjs --history-limit 100

      - name: Commit and push test history
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git add -f .allure/history.jsonl
          git commit -m "chore: update test history"
          git push

      - name: Allure Report Official
        uses: allure-framework/allure-action@v0
        with:
          report-directory: "./allure-report"
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./allure-report

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
